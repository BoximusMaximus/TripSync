services:
  db:
    build: ./db
    container_name: db-container
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    container_name: redis-container
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: django-container
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
#      args:
        # build-time only (vite inlines it into the bundle); the Makefile's --env-file
        # makes this resolve from backend/.env, so the whole deploy has one env file
 #       VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY}"
    container_name: react-container
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
