name: Frontend Cypress Tests

on:
  push:
    branches:
      - frontend
      - dev
      - main

  pull_request:
    branches:
      - frontend
      - dev
      - main

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend env
        run: |
          cat <<EOF > backend/.env
          DJANGO_SECRET_KEY=test-secret-key-for-cypress
          DEBUG=True
          ALLOWED_HOSTS=localhost,127.0.0.1,backend
          POSTGRES_DB=tripsync_db
          POSTGRES_USER=tripsync_user
          POSTGRES_PASSWORD=tripsync_password
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_URL=redis://redis:6379/0
          AUTH_COOKIE_SECURE=False
          AUTH_COOKIE_SAMESITE=Lax
          EOF

      - name: Start Docker containers
        run: docker compose up -d --build

      - name: Check Django environment
        run: |
          docker compose exec -T backend env | grep SECRET_KEY || true

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U tripsync_user -d tripsync_db; then
              echo "Database is ready"
              exit 0
            fi

            echo "Waiting for database..."
            sleep 2
          done

          echo "Database failed to start"
          docker compose logs db
          exit 1

      - name: Run migrations
        run: docker compose exec -T backend python manage.py migrate

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/users/info/')" 2>&1 | grep -qE "HTTP Error (401|403|400)"; then
              echo "Backend is responding"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5173/; then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend failed to start"
          docker compose logs frontend
          exit 1

      - name: Reset frontend node_modules ownership
        run: sudo rm -rf frontend/node_modules

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: true
          browser: chrome
          config: baseUrl=http://localhost:5173
          
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Shut down containers
        if: always()
        run: docker compose down
